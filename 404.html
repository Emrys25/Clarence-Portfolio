<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page Not Found, Clarence Ruwzhi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--cream);
            padding: var(--space-xl);
        }
        .error-content {
            text-align: center;
            max-width: 600px;
        }
        .error-code {
            font-family: var(--font-heading);
            font-size: 10rem;
            font-weight: 700;
            color: var(--navy);
            line-height: 1;
            margin-bottom: var(--space-md);
        }
        .error-code span {
            color: var(--purple);
        }
        .error-title {
            font-family: var(--font-heading);
            font-size: var(--text-3xl);
            color: var(--navy);
            margin-bottom: var(--space-md);
        }
        .error-text {
            font-size: var(--text-lg);
            color: var(--gray-600);
            margin-bottom: var(--space-xl);
        }
        .error-actions {
            display: flex;
            gap: var(--space-md);
            justify-content: center;
            flex-wrap: wrap;
        }
        @media (max-width: 768px) {
            .error-code { font-size: 6rem; }
        }
    </style>
</head>
<body>
    <main class="error-page">
        <div class="error-content">
            <div class="error-code">4<span>0</span>4</div>
            <h1 class="error-title">Page not found</h1>
            <p class="error-text">The page you're looking for doesn't exist or has been moved. Let's get you back to somewhere useful.</p>
            <div class="error-actions">
                <a href="/" class="btn btn-primary">Back to Home</a>
                <a href="/work.html" class="btn btn-secondary">View Work</a>
            </div>
        </div>
    </main>
</body>
</html>
