<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="base-path" content="/Clarence-Portfolio/" />
    <title>404 | Clarence.R</title>
    <meta name="description" content="Page not found." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/Clarence-Portfolio/css/style.css" />
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to main content</a>
    <!-- Animated background -->
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="bg-noise" aria-hidden="true">
      <svg width="100%" height="100%">
        <filter id="noiseFilter">
          <feTurbulence
            type="fractalNoise"
            baseFrequency="0.65"
            numOctaves="3"
            stitchTiles="stitch"
          />
        </filter>
        <rect width="100%" height="100%" filter="url(#noiseFilter)" />
      </svg>
    </div>
    <div class="bg-floaters" aria-hidden="true">
      <span class="floater f1">const</span>
      <span class="floater f2">async</span>
      <span class="floater f3">&lt;/&gt;</span>
      <span class="floater f4">{ }</span>
      <span class="floater f5">=&gt;</span>
      <span class="floater f6">404</span>
      <span class="floater f7">npm i</span>
      <span class="floater f8">git push</span>
      <span class="floater f9">true</span>
      <span class="floater f10">null</span>
    </div>

    <div id="header-placeholder"></div>

    <main id="main">
      <section class="error-page section-padding">
        <div class="container">
          <p class="error-code">404</p>
          <h1 class="error-title">Page not found.</h1>
          <div class="error-terminal">
            <div class="terminal-bar">
              <span class="dot red"></span>
              <span class="dot yellow"></span>
              <span class="dot green"></span>
              <span class="terminal-title">error.log</span>
            </div>
            <div class="terminal-body">
              <p>
                <span class="t-prompt">$</span>
                <span class="t-cmd">curl -I <span id="error-url"></span></span>
              </p>
              <p class="t-output t-error">HTTP/1.1 404 Not Found</p>
              <p class="t-output">The route you requested does not exist.</p>
              <p class="t-output">
                It may have been moved, deleted, or never existed.
              </p>
              <p>
                <span class="t-prompt">$</span> <span class="t-cursor">_</span>
              </p>
            </div>
          </div>
          <div class="error-actions">
            <a href="/Clarence-Portfolio/" class="btn btn-primary">Go Home</a>
            <a href="/Clarence-Portfolio/work.html" class="btn btn-outline"
              >View My Work</a
            >
            <a href="/Clarence-Portfolio/contact.html" class="btn btn-outline"
              >Contact Me</a
            >
          </div>
        </div>
      </section>
    </main>

    <div id="footer-placeholder"></div>

    <script>
      var urlEl = document.getElementById("error-url");
      if (urlEl) urlEl.textContent = window.location.pathname;
    </script>
    <script src="/Clarence-Portfolio/js/main.js"></script>
  </body>
</html>
